<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsividade</title>

    <style>
        *, *:before, *::after {
            box-sizing: border-box;
            /*margin: 0;
            padding: 0; */
        }

        div {
            width: 80%;
            height: 75px;
            background-color: blue;
            margin: 1px;
            display: inline-block;
        }
        
        /* adaptar para outras telas (celular) */
        @media screen and (min-width: 720px) { 
            div {
                width: 40%;
                background-color: red;
            }
        }

        @media screen and (min-width: 992px) {
            div {
                width: 30%;
                background-color: green;
            }
        }

        img. video {
            max-width: 100%;
            height: auto;
            display: block;
        }



    </style>
</head>
<body>
    <header>
        <h1>Responsivo</h1>
    </header>

    <main>
        <div></div>
        <div></div>
        <div></div>

    </main>
    
</body>
</html>
