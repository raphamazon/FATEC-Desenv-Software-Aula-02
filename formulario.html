<!DOCTYPE html>
<html>
    <head>
        <title>Formularios</title>
    </head>

    <body>

        <form action="" method="GET" enctype="multipart/form-data"> <!--PHP recebe outro código, "" GET cai na pagina-->
            
            <label for="id_nome">*Nome:</label> <!--identifica o label em modo texto, uso somente em form-->
            <input id="id_nome" name="nome" required> <!--required: requisito obrigatorio-->
            
            <br>

            <label for="id_idade">Idade:</label>
            <input type="number" id="id_idade" name="idade" min="0" max="100"> <!--min e max são nºs reais-->

            <br>

            <label for="id_nascimento">Data de Nascimento:</label>
            <input type="date" id="id_nascimento" name="nascimento" max="2026-09-05"> <!--date: datas - padrao US-->

            <br>

            <label for="id_hora">Hora:</label>
            <input type="time" id="id_hora" name="hora" min="09:00" max="17:00"> <!--time: tempo horas, minutos, segundos-->

            <br>

            <label for="id_datetime">Data e Hora:</label> <!--data e hora juntos-->
            <input type="datetime-local" id="id_datetime" name="datetime"   min="2026-09-05T12:00"> <!--data + T (hora)-->

            <br>

            <label for="id_range">Range:</label>
            <input type="range" id="id_range" name="range" min="0" max="10" step="0.5">

            <br>

            <label for="id_email">Email:</label>
            <input type="email" id="id_email" name="email"> <!-- email padrão: nada@nada.com-->

            <br>

            <label for="id_url">URL:</label>
            <input type="url" id="id_url" name="url"> <!-- URLs padrões, https://www.site.com.br-->

            <br>
           
            <label for="id_senha">Senha</label>
            <input type="password" id="id_senha" name="senha" pattern=".{8,}"> 

            <!--pattern: padrão // . caracteres // {min,max}-->            
            <!--password esconde caracteres ******* -->            
            <!--maxlenght: maximo caracteres-->
            <!--minlenght: minimo caracteres, se campos iguais = valor fixo-->

            <br>

            <label for="id_tele">Telefone:</label>
            <input type="tel" id="id_tel" name="telefone">

            <br>

            <label for="id_resumo">Resumo</label>
            <textarea id="id_resumo" name="resumo" rows="3" cols="20"></textarea> <!-- entre >< pode escrever algo inicial-->
            <!-- rows: qtd de linha campo // cols: qtd de coluna no campo-->

            <br>

            <input type="checkbox"  value="5" name="acordo" id="id_acordo"> <!--item para assinalar, caixas-->
            <label for="id_acordo">Estou de acordo</label>

            <br>

            <p>Escolha o radio:
            <input type="radio" id="id_radio" name="radio" value="r1"> <!-- item de assinalar fixo, sem tirar o check-->
            <label for="id_radio1">Radio 1</label>
                   
            <input type="radio" id="id_radio" name="radio" value="r2">
            <label for="id_radio2">Radio 2</label>
        
            <br>

            <label for="id_cidade">*Cidade</label> <!--boas praticas: * para indicar obrigatorio para usuario-->
            <select id="id_cidade" name="cidade" required> <!--select: caixa de alternativas-->
                <option></option> <!-- campo em branco na primeira opção-->
                <option value="A">Araras</option> <!--passa o valor A para o código, não ARARAS, quando value-->
                <option value="L">Leme</option> 
                <option value="R" selected>Rio Claro</option> <!-- selected: valor padrão inicial-->
            </select>
            
            <br> <!--pular a linha-->
            <button type="submit">Enviar</button>
            
        </form>

    </body>

</html>
